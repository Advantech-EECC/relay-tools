name: Build Debian Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dh-virtualenv \
            python3-dev \
            python3-venv

      - name: Update changelog version
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -R)
          sed -i "1s/.*/relay-tools (${VERSION}-1) unstable; urgency=medium/" debian/changelog
          sed -i "s|^ -- .*$| -- Mikhail Tsukerman <mikhail.tsukerman@advantech.de>  ${DATE}|" \
            debian/changelog

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - name: Verify package contents
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          for package in dist/*.deb; do
            actual_arch=$(dpkg-deb -f "$package" Architecture)
            if [ "$actual_arch" != "$EXPECTED_ARCH" ]; then
              echo "::error::expected ${EXPECTED_ARCH}, got ${actual_arch} in ${package}"
              exit 1
            fi
          done
          dpkg-deb -c dist/*.deb | tee /tmp/deb-contents.txt
          for path in \
            ./usr/lib/systemd/system/relay-mcp.service \
            ./usr/share/relay-tools/examples/relay-mcp.env.example \
            ./usr/lib/systemd/system/relay-daemon.service \
            ./usr/share/relay-tools/examples/channels.yaml \
            ./usr/share/relay-tools/examples/lab-board.yaml \
          ; do
            if ! grep -qF " ${path}" /tmp/deb-contents.txt; then
              echo "::error::missing ${path} in .deb package"
              exit 1
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relay-tools-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload .deb to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
